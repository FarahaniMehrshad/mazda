server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SSE log stream — must NOT buffer, otherwise the client sees nothing until
    # the response closes and the "Running" state appears to hang.
    location ~ ^/api/generations/[^/]+/execution/stream$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        gzip off;
    }

    # MCP transport (Streamable HTTP + legacy SSE). Mounted under /api/ so it
    # doesn't collide with the SPA's /mcp management page. Tool calls run the
    # full pipeline synchronously (LLM round-trips + Playwright execution) —
    # easily several minutes; the legacy-SSE GET stream stays open even longer.
    # Disable buffering and grant a long read/send timeout. This location must
    # appear BEFORE the generic /api/ block since nginx prefix-matching picks
    # the longest match by default, but listing it first is also defensive
    # against any future re-ordering.
    location /api/mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        gzip off;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every non-/api/ path falls through to index.html so React
    # Router can serve /mcp, /signatures, /runs, etc. as in-browser routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
