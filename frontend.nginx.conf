server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SSE log stream — must NOT buffer, otherwise the client sees nothing until
    # the response closes and the "Running" state appears to hang.
    location ~ ^/api/generations/[^/]+/execution/stream$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        gzip off;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable-HTTP transport. Tool calls run the full pipeline
    # synchronously (LLM round-trips + Playwright execution) — easily several
    # minutes. Disable buffering for the SSE GET channel and grant a long read
    # timeout so the proxy doesn't tear the connection down mid-run.
    location /mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        gzip off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
