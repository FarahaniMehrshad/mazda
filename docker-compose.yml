services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mazda
      POSTGRES_PASSWORD: mazda
      POSTGRES_DB: mazda
    volumes:
      - mazda-pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazda"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=mazda;Username=mazda;Password=mazda"
      Jwt__Secret: "${JWT_SECRET:-change-me-this-must-be-at-least-32-chars-long}"
      Jwt__Issuer: "mazda"
      Jwt__Audience: "mazda"
      Llm__BaseUrl: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      Llm__ApiKey: "${LLM_API_KEY:-}"
      Llm__AnalyzerModel: "${LLM_ANALYZER_MODEL:-gpt-4o-mini}"
      Llm__GeneratorModel: "${LLM_GENERATOR_MODEL:-gpt-4o}"
      Cors__AllowedOrigin: "http://localhost:5173"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5080:8080"

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mazda-pgdata:
